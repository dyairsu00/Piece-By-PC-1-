<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080808">
<title>Piece by PC | Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #080808;
    --text: #ffffff;
    --muted: #888888;
    --border: #303030;
    --input: #151515;
    --button-bg: #ffffff;
    --button-text: #080808;
}

body.light-mode {
    --bg: #ffffff;
    --text: #080808;
    --muted: #777777;
    --border: #dedede;
    --input: #f3f3f3;
    --button-bg: #080808;
    --button-text: #ffffff;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    min-height: 100%;
}

body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100svh;
    overflow-x: hidden;
    transition:
        background-color 1.2s cubic-bezier(.22,1,.36,1),
        color 1.2s cubic-bezier(.22,1,.36,1);
}

body,
body * {
    transition:
        background-color 1.2s cubic-bezier(.22,1,.36,1),
        color 1.2s cubic-bezier(.22,1,.36,1),
        border-color 1.2s cubic-bezier(.22,1,.36,1),
        fill 1.2s cubic-bezier(.22,1,.36,1),
        stroke 1.2s cubic-bezier(.22,1,.36,1);
}

/* NAVIGATION */

.navbar {
    height: 90px;
    padding: 0 7%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid var(--border);
}

.logo {
    display: flex;
    align-items: center;
    gap: 13px;
    color: var(--text);
    text-decoration: none;
    cursor: pointer;
}

.logo-icon {
    width: 47px;
    height: 47px;
    border: 2px solid var(--text);
    display: grid;
    place-items: center;
    font-family: 'Space Grotesk';
    font-size: 28px;
    font-weight: 700;
}

.logo-name {
    font-family: 'Space Grotesk';
    font-size: 30px;
    font-weight: 800;
    letter-spacing: -1.7px;
}

.logo-name span {
    font-weight: 800;
}

.nav-label {
    font-size: 10px;
    letter-spacing: 3px;
    font-weight: 800;
    opacity: .55;
}

/* LOGIN LAYOUT */

.login-section {
    min-height: calc(100vh - 90px);
    min-height: calc(100svh - 90px);
    display: grid;
    grid-template-columns: 1fr 1fr;
    align-items: center;
    padding: 65px 8%;
    gap: 8%;
}

/* LOGIN FORM */

.login-content {
    max-width: 440px;
    width: 100%;
    margin: auto;
}

.eyebrow {
    font-size: 11px;
    letter-spacing: 3px;
    font-weight: 800;
    opacity: .75;
    margin-bottom: 22px;
}

h1 {
    font-family: 'Space Grotesk';
    font-size: clamp(58px, 6vw, 78px);
    font-weight: 800;
    letter-spacing: -4.5px;
    line-height: 1;
    margin-bottom: 17px;
}

.subtitle {
    color: var(--muted);
    font-size: 13px;
    line-height: 1.8;
    margin-bottom: 40px;
}

.form-group {
    margin-bottom: 15px;
}

.form-group input {
    width: 100%;
    height: 58px;
    padding: 0 18px;
    background: var(--input);
    border: 1px solid var(--border);
    color: var(--text);
    font-size: 13px;
    font-weight: 600;
    outline: none;
}

.form-group input::placeholder {
    color: var(--muted);
}

.form-group input:focus {
    border-color: var(--text);
}

.password-field {
    position: relative;
}

.password-field input {
    padding-right: 70px;
}

.show-password {
    position: absolute;
    right: 17px;
    top: 50%;
    transform: translateY(-50%);
    border: none;
    background: none;
    color: var(--text);
    font-size: 10px;
    font-weight: 800;
    cursor: pointer;
}

.options {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 11px;
    margin: 22px 0 27px;
    color: var(--muted);
}

.remember {
    display: flex;
    gap: 8px;
    align-items: center;
}

.remember input {
    accent-color: var(--text);
}

.options a {
    color: var(--text);
    text-decoration: none;
}

.login-btn {
    height: 57px;
    width: 100%;
    background: var(--button-bg);
    color: var(--button-text);
    border: 1px solid var(--button-bg);
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 2.5px;
    cursor: pointer;
}

.login-btn:hover {
    transform: translateY(-3px);
}

.login-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
    transform: none;
}

.create-account {
    text-align: center;
    margin-top: 24px;
    color: var(--muted);
    font-size: 12px;
}

.create-account a {
    color: var(--text);
    font-weight: 800;
    text-decoration: underline;
    text-underline-offset: 4px;
    margin-left: 4px;
}

/* BLUEPRINT */

.blueprint-area {
    width: 100%;
    max-width: 650px;
    margin: auto;
    cursor: pointer;
}

.blueprint-area svg {
    width: 100%;
    height: auto;
}

.blueprint-area:hover svg {
    transform: scale(1.02);
}

.blueprint-area .line {
    fill: none;
    stroke: var(--text);
    stroke-width: 1.2;
    stroke-linecap: round;
    stroke-linejoin: round;
}

.blueprint-area .fine {
    fill: none;
    stroke: var(--text);
    stroke-width: .6;
    opacity: .45;
}

.blueprint-area .dash {
    fill: none;
    stroke: var(--text);
    stroke-width: .7;
    stroke-dasharray: 4 5;
    opacity: .5;
}

.blueprint-area text {
    fill: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 9px;
    letter-spacing: 2px;
    font-weight: 700;
}

.blueprint-area .small {
    font-size: 7px;
    opacity: .55;
}

/* FOOTER LABEL */

.bottom-label {
    text-align: center;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 3px;
    padding: 20px;
    opacity: .6;
    border-top: 1px solid var(--border);
}

/* THEME TOGGLE */

.nav-actions {
    display: flex;
    align-items: center;
    gap: 24px;
}

.theme-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 9px;
    min-height: 40px;
    padding: 0 14px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 1.4px;
    cursor: pointer;
}

.theme-toggle:hover {
    border-color: var(--text);
}

.theme-toggle:focus-visible,
.show-password:focus-visible,
.login-btn:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 4px;
}

.theme-icon {
    font-size: 15px;
    line-height: 1;
}

/* RESPONSIVE */

@media(max-width: 850px) {
    .login-section {
        grid-template-columns: 1fr;
        padding: 60px 8%;
        gap: 60px;
    }

    .login-content {
        max-width: 500px;
    }

    .blueprint-area {
        max-width: 560px;
    }

    h1 {
        font-size: 58px;
        font-weight: 800;
    }
}

@media(max-width: 500px) {
    .navbar {
        height: 75px;
        padding: 0 6%;
    }

    .logo-icon {
        width: 39px;
        height: 39px;
        font-size: 23px;
    }

    .logo-name {
        font-size: 24px;
        font-weight: 800;
    }

    .nav-label {
        display: none;
    }

    .nav-actions {
        gap: 10px;
    }

    .theme-toggle {
        min-height: 36px;
        padding: 0 10px;
        font-size: 9px;
    }

    .login-section {
        padding: 65px 7% 35px;
        gap: 45px;
    }

    h1 {
        font-size: 55px;
        font-weight: 800;
        letter-spacing: -3px;
    }

    .bottom-label {
        font-size: 8px;
        letter-spacing: 2px;
    }
}

@media(prefers-reduced-motion: reduce) {
    body,
    body * {
        transition-duration: .01ms !important;
    }
}
</style>
</head>

<body>

</main>

<div class="bottom-label">
    COMPUTER PERIPHERALS &nbsp; | &nbsp; HARD COMPONENTS
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
/* ==================================
   SUPABASE CONFIGURATION
================================== */

const SUPABASE_URL = "https://keahdsumaiztwikoviuk.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_Lo1_wTNKOaaj_T5MAy8JFA_eLb6CIKt";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
);

/* ==================================
   THEME
================================== */

const themeToggle = document.getElementById("themeToggle");
const themeIcon = document.getElementById("themeIcon");
const themeText = document.getElementById("themeText");
const themeColor = document.querySelector('meta[name="theme-color"]');

function setTheme(mode) {
    const isLight = mode === "light";

    document.body.classList.toggle("light-mode", isLight);
    themeIcon.textContent = isLight ? "☾" : "☼";
    themeText.textContent = isLight ? "NIGHT MODE" : "LIGHT MODE";

    themeToggle.setAttribute("aria-pressed", String(isLight));

    themeToggle.setAttribute(
        "aria-label",
        isLight ? "Switch to night mode" : "Switch to light mode"
    );

    themeColor.setAttribute(
        "content",
        isLight ? "#ffffff" : "#080808"
    );

    localStorage.setItem("pieceByPCTheme", mode);
}

const savedTheme = localStorage.getItem("pieceByPCTheme");

setTheme(savedTheme === "light" ? "light" : "night");

themeToggle.addEventListener("click", function () {
    const isCurrentlyLight =
        document.body.classList.contains("light-mode");

    setTheme(isCurrentlyLight ? "night" : "light");
});

/* ==================================
   PASSWORD VISIBILITY
================================== */

document.getElementById("togglePassword").addEventListener("click", function () {
    const password = document.getElementById("password");
    const visible = password.type === "password";

    password.type = visible ? "text" : "password";
    this.textContent = visible ? "HIDE" : "SHOW";
});

/* ==================================
   AUTHENTICATION
================================== */

const authMessage = document.getElementById("authMessage");
const loginSubmit = document.getElementById("loginSubmit");

function showAuthMessage(message, isError = true) {
    authMessage.textContent = message;
    authMessage.style.color = isError ? "#e06b6b" : "#55b889";
}

/* Redirect users who already have an active session. */



/* LOGIN */

document.getElementById("loginForm").addEventListener("submit", async function (event) {
    event.preventDefault();

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
        showAuthMessage("Enter your email and password.");
        return;
    }

    loginSubmit.disabled = true;
    loginSubmit.textContent = "SIGNING IN...";

    showAuthMessage("Checking your account...", false);

    const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
    });

    if (error) {
        showAuthMessage(error.message);

        loginSubmit.disabled = false;
        loginSubmit.innerHTML = "LOG IN &nbsp; →";
        return;
    }

    localStorage.setItem(
        "pieceByPCUserName",
        data.user.user_metadata?.full_name || ""
    );

    localStorage.setItem(
        "pieceByPCUserEmail",
        data.user.email || email
    );

    showAuthMessage("Login successful. Redirecting...", false);

    window.location.replace("userMenu.html");
});
</script>

</body>
</html>
